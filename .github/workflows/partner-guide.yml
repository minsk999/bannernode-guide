# 협력사 설명서 자동 생성
# 사내 설명서(index.html)·데모·생성기가 바뀌어 main 에 올라오면 partner/ 를 다시 만들어 커밋한다.
# 생성기가 실패하면(사내 전용 낱말이 남거나 규칙이 낡음) 아무것도 커밋하지 않는다 → 협력사 페이지는 마지막 정상본 그대로.
# GITHUB_TOKEN 으로 올린 커밋은 Pages 빌드를 일으키지 않으므로(GitHub 문서) 마지막에 빌드를 직접 요청한다.
#   (봇 커밋은 워크플로도 다시 깨우지 않는다 — 같은 이유. 그래서 무한 반복이 없다.)
name: partner-guide

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'workflow-demo.html'
      - '.github/partner/**'
      - '.github/workflows/partner-guide.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: partner-guide
  cancel-in-progress: false

jobs:
  build:
    # 손으로 돌릴 때 다른 가지에서 누르면 그 가지가 main 으로 밀려 올라간다 → main 에서만
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 항상 main 끝에서 만든다 — 옛 실행을 다시 돌려도 옛 설명서·옛 생성기로 만든 결과가 올라가지 않는다
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 협력사 페이지 생성 + 검사 + 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            # 실패하면 여기서 끝난다(set -e) — partner/ 는 손대지 않은 채다(생성기는 검사를 통과해야만 쓴다)
            python3 .github/partner/make_partner.py
            if [ -z "$(git status --porcelain -- partner/)" ]; then
              echo "바뀐 것 없음"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -A -- partner/
            git commit -m "협력사 설명서 자동 생성 ($(git rev-parse --short HEAD))"
            if git push origin HEAD:main; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 그 사이 main 이 움직였다 — 합치지 않고 새 main 에서 처음부터 다시 만든다(같은 파일을 두 커밋이 고쳐 충돌하는 일을 피한다)
            echo "push 거절 — main 을 다시 받아 처음부터($i/3)"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "push 3회 실패"
          exit 1

      # 손으로 돌렸을 때는 바뀐 것이 없어도 빌드를 요청한다 — 「커밋은 올라갔는데 빌드 요청만 실패한」 경우를 되살리는 길
      - name: Pages 빌드 요청
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"; then exit 0; fi
            sleep 10
          done
          echo "Pages 빌드 요청 3회 실패 — 사람 토큰으로 한 번 요청할 것(README 4절)"
          exit 1
