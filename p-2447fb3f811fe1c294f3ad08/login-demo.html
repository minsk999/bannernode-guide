<meta name="viewport" content="width=device-width,initial-scale=1"><title>패스워드 입장 방법 시연</title><link rel="icon" type="image/svg+xml" href="media/bannernode-icon.svg"><link rel="stylesheet" href="demo-font.css"><script>document.documentElement.dataset.mode=new URLSearchParams(location.search).get('mode')==='guide'?'guide':'app';</script><style>


*{box-sizing:border-box}html,body{margin:0}body{--idle-h:375px;--rest-bias:18px;min-height:100%;background:radial-gradient(1100px 560px at 50% -8%,#10131b 0%,#0a0b0f 62%);color:#e7e9ef;font-family:'PretendardBN',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,calc((var(--vph,100vh) - var(--idle-h)) / 2 - var(--rest-bias))) 20px 40px}
html[data-mode="guide"] .sub-app,html[data-mode="app"] .sub-guide{display:none}
.card,#demo-cursor{visibility:hidden}body[data-ready="true"] .card,body[data-ready="true"] #demo-cursor{visibility:visible}
.card{text-align:center;padding:46px 40px;max-width:410px;width:100%;background:rgba(22,25,33,.55);border:1px solid #23262f;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center}
.title,.sub,.msg,.jg,.note{width:100%}
.logo{width:56px;height:56px;margin:0 auto 20px;display:block;filter:drop-shadow(0 8px 22px rgba(162,255,0,.28))}
.mark{font-size:12.5px;font-weight:800;letter-spacing:.2em;color:#a2ff00;text-transform:uppercase;margin-bottom:9px}
.title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:#9aa0ad;font-size:13.5px;line-height:1.65;margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:11px;padding:12px 22px 12px 19px;border-radius:999px;border:1px solid #2a2e39;background:#1b1f28;color:#e7e9ef;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#a2ff00;color:#a2ff00}.btn:disabled{opacity:.5;cursor:default}.btn svg{width:18px;height:18px}
/* 상태문구 — 대기 상태엔 자리를 아예 차지하지 않고, 나타날 때 아래를 밀며 펼쳐진다.
   ★grid-template-rows:0fr→1fr 는 「내용의 자연 높이」로 정확히 보간된다. max-height 트릭은
     내용(20~40px)과 상한(64px)이 달라 구간의 절반 이상이 죽은 시간이 된다(실측).
     자식(.msgt)의 overflow:hidden 이 접힘의 필수 조건 — 빼면 안 접힌다(min-height:0 은 보험).
   ★여백은 래퍼(.msg)의 margin 에 둔다. 그리드 아이템의 padding 으로 두면 0fr 로 접어도
     border-box 최소값이 그 padding 이라 그만큼이 대기 상태에 그대로 남는다(실측 확인). */
.msg{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;transition:grid-template-rows .28s cubic-bezier(.32,.72,0,1),margin-top .28s cubic-bezier(.32,.72,0,1),opacity .18s ease}
.msg.on{grid-template-rows:1fr;opacity:1;margin-top:16px}
.msgt{overflow:hidden;min-height:0;margin:0 auto;max-width:340px;font-size:13px;line-height:1.55}
.msg.err .msgt{color:#ff6b6b}
/* ★패스워드 패널이 열려 있는 동안엔 상태문구 한 줄 자리를 **미리 비워 둔다**.
   안 그러면 「입장」을 누르는 순간 '확인 중…' 이 펼쳐지며 카드가 36.1px 자란다
   (실측 1024x700 · 임베드 Pretendard · 트랜지션 off: 패널 열림 423.5 → 입장 459.6
    = 문구 한 줄 20.15 + 위 여백 16 = 36.1px. 대기 374.7).
   ★재볼 때 뷰포트를 반드시 1024x700 으로 맞출 것 — 창이 좁으면 카드가 max-width 410 을 못 채워
     본문이 접히고 전혀 다른 숫자가 나온다(처음 잰 값이 그래서 틀렸다).
   카드 상단은 앵커로 고정돼 있어 아래로만 자라지만, 누를 때마다 창이 늘었다 줄었다 한다(사용자 지적).
   ★대기 상태(패널 닫힘)엔 아무 자리도 안 차지한다 — 예전에 카드를 최악 높이로 고정했다가
     구글 버튼과 링크 사이가 130px 로 벌어졌던 그 처방으로 돌아가지 않는다.
   ★한 줄이면 충분하다: 이 경로에 실제로 뜨는 문구 6종이 전부 1줄(20.1px)임을 실측했다
     (가장 긴 것 = '확인 중 오류가 발생했어요. 다시 시도해 주세요.', max-width 340px).
   ★:has() 를 쓰지 않는다 — 구형 WebView2 런타임에서 조용히 무시된다(검은 화면 사례와 같은 조건).
     대신 아래 JS 가 카드에 .jg-open 을 직접 붙인다. */
.card.jg-open .msg{grid-template-rows:1fr;margin-top:16px}
.card.jg-open .msgt{min-height:1.55em}
.note{color:#5b6270;font-size:12px;margin:30px 0 0}
/* 버튼↔링크 20 / 링크↔안내문 30 — 구글 버튼과 「패스워드로 로그인」은 「주 경로+대체 경로」라 한 묶음이고,
   안내문은 링크와 글자크기·색이 같아(12px/#5b6270) 간격이 비슷하면 한 문단으로 읽힌다.
   ★flex+line-height 로 줄상자(strut)를 없애야 명세값 = 화면값이 된다 —
     블록이면 body 의 line-height(normal) 만큼 링크 위에 여분이 붙어 20 이 24 로 렌더된다. */
.jg{margin-top:20px;display:flex;flex-direction:column;line-height:1.2}
.jg-t{color:#5b6270;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.jg-t:hover{color:#9aa0ad}
.jg-w{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;visibility:hidden;transition:grid-template-rows .28s cubic-bezier(.32,.72,0,1),margin-top .28s cubic-bezier(.32,.72,0,1),opacity .18s ease,visibility 0s linear .28s}
.jg-w.on{grid-template-rows:1fr;opacity:1;margin-top:10px;visibility:visible;transition:grid-template-rows .28s cubic-bezier(.32,.72,0,1),margin-top .28s cubic-bezier(.32,.72,0,1),opacity .18s ease,visibility 0s}
.jg-row{display:flex;gap:8px;justify-content:center;overflow:hidden;min-height:0}
.jg-row input{width:180px;padding:10px 14px;border-radius:999px;border:1px solid #2a2e39;background:#12141b;color:#e7e9ef;font:inherit;font-size:13px;text-align:center;letter-spacing:.06em;outline:none}
.jg-row input:focus{border-color:#a2ff00}
.btn.jg-go{padding:10px 18px}
@media (prefers-reduced-motion:reduce){.msg,.jg-w{transition:none}}
body{padding:24px 16px 12px;min-height:0;background:transparent;font-family:PretendardBN,Pretendard,sans-serif}.card{flex-shrink:0}.jg-row input.demo-focus{border-color:#a2ff00}.jg-go.demo-press{transform:scale(.95);border-color:#a2ff00;color:#a2ff00}
#demo-cursor{position:fixed;left:0;top:0;width:28px;height:28px;z-index:5;pointer-events:none;filter:drop-shadow(0 2px 3px #0008)}
@media(max-width:390px){.card{padding:30px 20px}.title{font-size:20px}.sub{font-size:13px}.jg-row input{min-width:0;width:165px}.note{font-size:11px}}
