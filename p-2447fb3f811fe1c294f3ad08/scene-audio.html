<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BannerNode audio 시연</title><link rel="icon" type="image/svg+xml" href="media/bannernode-icon.svg"><link rel="stylesheet" href="demo-font.css"><style>

  :root{

    --glowS:0 0 0 1.5px var(--sel),0 0 30px -5px rgba(var(--accRGB),.45); --glowG:0 0 0 1.5px var(--bgm),0 0 30px -5px var(--bgmG);
    --glowN:0 0 0 1px rgba(255,255,255,.16),0 16px 38px rgba(0,0,0,.52);

  *{box-sizing:border-box}
  #tooltip{position:fixed;z-index:900;pointer-events:none;width:max-content;white-space:normal;max-width:min(280px,86vw);line-height:1.5;font-size:11.5px;font-weight:500;background:#14171f;color:var(--txt);padding:7px 12px 7px 13px;border-radius:9px;border:1px solid var(--stroke);border-left:2.5px solid var(--acc);box-shadow:0 8px 22px rgba(0,0,0,.4);opacity:0;transform:translate(-50%,6px);transition:opacity .15s var(--ease),transform .22s var(--ease)}

    box-shadow:var(--shadowS);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  .app{position:relative;height:100%;width:100%}
  
  .titlebar{display:none}

    background:#0b0d13;user-select:none;-webkit-user-select:none}

  .tb-close:hover{color:#0a0b0f} .tb-close:hover::before{background:var(--video)}

  svg.edges path{stroke-width:1.8}

  
  .node{position:absolute;width:208px;border-radius:var(--r);cursor:grab;transform:translateZ(0);
    background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);

  .node.audio.sel::before,.node.audio.linked::before{box-shadow:var(--shadow),0 0 0 2px var(--bgm)!important}
  svg.edges path.e.glow{stroke-width:3.8;opacity:1}

/* Load after scenes.css. Motion and click scale belong to the zero-size anchor;
   artwork offsets belong to its children so scaling never moves the hotspot. */
#pointer {
  position: absolute;
  width: 0;
  height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: visible;
  pointer-events: none;
  transform-origin: 0 0;
  filter: none;
  z-index: 800;
}

#pointer > svg {
  position: absolute;
  inset: auto;
  left: 0;
  top: 0;
  /* 58px at hero width 1680 maps to 34.5px at stage width 1000.
     Use 40px to retain finger detail when the stage is scaled down. */
  width: 40px;
  height: 40px;
  display: none;
  opacity: 1;
  overflow: visible;
  pointer-events: none;
  animation: none;
  transition: none;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .6));
}

/* Exact viewBox hotspots: arrow (6,2.8), finger (10.7,3.9),
   open palm and grip (11.6,9.5), resize (12,12), in a 24×24 box.
   Both hand modes share their hotspot so hover-to-drag does not jump. */
#pointer > .sh-arrow { transform: translate(-25%, -11.6666666667%); }
#pointer > .sh-point { transform: translate(-44.5833333333%, -16.25%); }
#pointer > .sh-grab,
#pointer > .sh-grabbing { transform: translate(-48.3333333333%, -39.5833333333%); }
#pointer > .sh-resize { transform: translate(-50%, -50%); }

#pointer:not([data-mode]) > .sh-arrow,
#pointer[data-mode="arrow"] > .sh-arrow,
#pointer[data-mode="point"] > .sh-point,
#pointer[data-mode="grab"] > .sh-grab,
#pointer[data-mode="grabbing"] > .sh-grabbing,
#pointer[data-mode="resize"] > .sh-resize { display: block; }

  const paths = {
    play: '<path d="m7 5 11 7-11 7Z" fill="currentColor" stroke="none"/>',
    pause: '<path d="M8 5v14M16 5v14" stroke-width="3"/>',
    replay: '<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/>',

  const icon = kind => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths[kind]}</svg>`;
  function label(button, text, kind) {
    if (!button || button.dataset.controlLabel === text) return;
    button.dataset.controlLabel = text;
    button.innerHTML = '<span class="demo-control-content">' + icon(kind) + '<span class="demo-control-label">' + text + '</span></span>';
    button.setAttribute('aria-label', text);
  }
  function play(button, paused, started = true, together = false) {
    label(button, together ? paused ? '함께 재생' : '함께 일시정지' : paused ? started ? '이어서 재생' : '재생' : '일시정지', paused ? 'play' : 'pause');

  document.addEventListener('mouseout',e=>{ const el=e.target.closest('[data-tip]'); if(el&&!el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('mousedown',hide,true);
  window.addEventListener('wheel',hide,{passive:true});
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
})();
</script>
</body></html>
