/* 레이아웃: 1280×720 발표 캔버스 한 장을 화면에 맞춰 줄인다 — 왼쪽 제목 · 오른쪽 앱 장면(640×400 설계 좌표, 반복 재생) */
:root{
  color-scheme:dark;
  --bg:#07080b; --canvas:#090a0e; --panel:#0e1017; --panel2:#141722; --field:rgba(0,0,0,.32);
  --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.16);
  --txt:#edeef4; --mut:#8b91a4; --dim:#585d6e;
  --accRGB:162,255,0; --banRGB:0,110,255; --bgmRGB:255,77,157;
  --acc:rgb(var(--accRGB)); --ban:rgb(var(--banRGB)); --bgm:rgb(var(--bgmRGB));
  --ok:#3bb985; --err:#e8576c; --warn:#e8b45a;
  --chk1:#232838; --chk2:#181d29;
  --ease:cubic-bezier(.32,.72,0,1);
  --f:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
.vp{position:fixed;inset:0;display:grid;place-items:center}
.deck{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:sin .5s var(--ease)}
@keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{position:absolute;left:64px;right:64px;top:34px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);font-weight:600}
.top .lg{width:22px;height:22px;display:block;flex:none}
.top .lg svg,.cover .big svg{width:100%;height:100%;display:block}   /* 로고 = 앱 아이콘(bannernode.ico.svg) — build.py 가 LOGO 로 넣는다 */
.top .sp{flex:1}
.top .n{font-variant-numeric:tabular-nums;color:var(--dim)}
.top .n b{color:var(--txt)}
/* 기능 장 */
.side{position:absolute;left:64px;top:118px;width:400px;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.tag.new{background:rgba(var(--accRGB),.14);color:var(--acc);border:1px solid rgba(var(--accRGB),.4)}
.tag.imp{background:rgba(var(--banRGB),.16);color:#6aa8ff;border:1px solid rgba(var(--banRGB),.45)}
.tag.fix{background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--stroke2)}
.side h2{margin:0;font-size:46px;line-height:1.16;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.side p{margin:0;font-size:19px;line-height:1.55;color:var(--mut);text-wrap:pretty}
.where{align-self:flex-start;font-size:13px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:7px;padding-top:4px}
.where::before{content:'';width:14px;height:1px;background:var(--dim)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.kc{height:26px;min-width:26px;padding:0 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--stroke2);border-bottom-width:2px;font:600 12.5px var(--f);color:var(--txt);display:inline-flex;align-items:center;justify-content:center}
.frame{position:absolute;right:64px;top:110px;width:720px;height:476px;border-radius:18px;background:var(--panel);border:1px solid var(--stroke);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.4);overflow:hidden}
.frame .bar{height:26px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.02)}
.frame .bar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12)}
.frame .bar span{margin-left:8px;font-size:11px;color:var(--dim);font-weight:600}
.stwrap{position:absolute;left:0;right:0;top:26px;bottom:0;display:grid;place-items:center}
.st{width:640px;height:400px;position:relative;overflow:hidden;transform:scale(1.125);transform-origin:center;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/24px 24px,var(--canvas);
  font-family:var(--f);font-size:12px;color:var(--txt)}
.nav{position:absolute;left:64px;right:64px;bottom:34px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--acc);width:22px;border-radius:4px}
.dot:focus-visible,.arw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav .sp{flex:1}
.arw{width:36px;height:36px;border-radius:50%;border:1px solid var(--stroke2);background:var(--panel);color:var(--txt);cursor:pointer;display:grid;place-items:center;padding:0}
.arw svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--dim);margin-right:8px}
/* 표지 */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:120px;gap:26px}
.cover .big{width:84px;height:84px;display:block;filter:drop-shadow(0 0 26px rgba(var(--accRGB),.38))}
.cover h1{margin:0;font-size:76px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.cover h1 em{font-style:normal;color:var(--acc)}
.cover .sub{font-size:22px;color:var(--mut)}
.cover .ver{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);display:flex;gap:14px;align-items:center}
.cover .ver b{color:var(--txt);font-weight:600}
.cover .ver s{color:var(--dim)}
/* 목차 */
.toc{position:absolute;left:64px;right:64px;top:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.toc h3{margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.toc ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.toc li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--stroke);background:var(--panel);font-size:16px;font-weight:600}
.toc li button:hover,.toc li button:focus-visible{border-color:rgba(var(--accRGB),.5)}
.toc li button i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);width:20px}
.toc li button em{margin-left:auto;font-style:normal;font-size:11px;color:var(--dim);font-weight:600}
/* 수리 모음 */
.fixes{position:absolute;left:64px;right:64px;top:286px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fx{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.slide.on .fx{opacity:1;transform:none}
.fx b{font-size:17px}
.fx span{font-size:14px;color:var(--mut);line-height:1.5}
.fx .ck{width:22px;height:22px;border-radius:50%;background:rgba(var(--accRGB),.16);display:grid;place-items:center;color:var(--acc)}
.fx .ck svg{width:12px;height:12px}
.fixhd{position:absolute;left:64px;top:110px;display:flex;flex-direction:column;gap:12px}
.fixhd h2{margin:0;font-size:46px;font-weight:700;letter-spacing:-.02em}
.fixhd p{margin:0;font-size:19px;color:var(--mut)}

/* ═══ 장면 부품(K) — 640×400 좌표 ═══ */
.k-cur{position:absolute;left:0;top:0;width:18px;height:22px;z-index:90;pointer-events:none;transition-property:left,top;transition-timing-function:var(--ease);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}

<script>

`, st);
    const bs = C.ban || 210, wa = C.win || [10, 12, 424, 376], B = C.layout === 'A'
      ? { win: wa, ban: [14, 48, bs], pan: [32 + bs, 48, wa[2] - 46 - bs] }
      : { win: [10, 10, 620, 380], ban: [22, 50, 300], pan: [346, 50, 252] };
    const [hx, hy, hw, hh] = C.hole, a = C.vAR;
    // 배너 그림 + 구멍(블러 바탕 · 영상) → view
    const banner = (box, S, vid) => {
      box.innerHTML = '<div class="k-ban"></div>' + C.deco.map(d => '<i class="xd' + (d[4] ? ' s' : '') + '" style="left:' + d[0] * 100 + '%;top:' + d[1] * 100 + '%;width:' + d[2] * 100 + '%;height:' + d[3] * 100 + '%"></i>').join('')

      const HW = hw * S, HH = hh * S, cov = a > HW / HH ? [HH * a, HH] : [HW, HW / a];
      return { hole: box.querySelector('.k-hole'), v: box.querySelector('.xv'), bg: box.querySelector('.xbg'), HW, HH, CW: cov[0], CH: cov[1], ZC: Math.min(HW / cov[0], HH / cov[1]) };
    };
    const paint = (V, s) => { const vw = V.CW * s.z, vh = V.CH * s.z;
      Object.assign(V.v.style, { width: vw + 'px', height: vh + 'px', left: -(vw - V.HW) / 2 * (1 + s.ox) + 'px', top: -(vh - V.HH) / 2 * (1 + s.oy) + 'px' });
      V.bg.classList.toggle('on', s.z < 0.9999); };
    // 창
    const win = h('div', 'k-win', '<div class="k-hd">' + C.title + '</div>', st);
    Object.assign(win.style, { left: B.win[0] + 'px', top: B.win[1] + 'px', width: B.win[2] + 'px', height: B.win[3] + 'px' });
    const bx = h('div', 'xb', null, win); Object.assign(bx.style, { left: B.ban[0] + 'px', top: B.ban[1] + 'px', width: B.ban[2] + 'px', height: B.ban[2] + 'px' });
    const main = banner(bx, B.ban[2], C.vid);
    // 패널(xfPanelHTML 의 글자 그대로)
    const pan = h('div', 'xp', '<div><div class="xl">크기<i class="zs"></i></div><div class="xs"><div class="xt"><i class="xk"></i><i class="xk"></i><i class="xh"></i></div><b>100%</b></div><div class="xg"><span>전체 보이기</span><span>꽉 채우기</span></div></div>'
      + (C.pos ? '<div><div class="xl">위치<i>구멍 안 기준</i></div><div class="xa">' + '<span></span>'.repeat(9) + '</div></div>' : '')
      + (C.acts ? '<div class="xc"><span>초기화</span><span class="ghost">같은 배너 전체에 적용</span></div>' : ''), win);
    Object.assign(pan.style, { left: B.pan[0] + 'px', top: B.pan[1] + 'px', width: B.pan[2] + 'px' });
    const q = s => pan.querySelector(s), zs = q('.zs'), zv = q('.xs b'), trk = q('.xt'), th = q('.xh'), ticks = pan.querySelectorAll('.xk');
    const [btnC, btnF] = pan.querySelectorAll('.xg span'), anc = [...pan.querySelectorAll('.xa span')], acts = [...pan.querySelectorAll('.xc span')];
    const LZ = Math.log(0.1), HZ = Math.log(4), z2t = z => (Math.log(z) - LZ) / (HZ - LZ), t2z = t => Math.exp(LZ + (HZ - LZ) * t);
    const tpos = t => 'calc(6.5px + (100% - 13px) * ' + t + ')';
    const ZC = main.ZC, STOPS = [1].concat(ZC < 0.999 && ZC > 0.1 ? [ZC] : []), near = (x, y) => Math.abs(x - y) < 1e-4;
    ticks[1].style.left = tpos(z2t(1));
    if (STOPS.length > 1) ticks[0].style.left = tpos(z2t(ZC)); else { ticks[0].remove(); btnC.classList.add('off'); }
    const S = Object.assign({ z: 1, ox: 0, oy: 0 }, C.start || {});
    const fmt = z => { const p = Math.round(z * 1000) / 10; return (Number.isInteger(p) ? p : p.toFixed(1)) + '%'; };
    const upd = () => { paint(main, S); const t = z2t(S.z);
      trk.style.setProperty('--p', t * 100 + '%'); th.style.left = tpos(t); zv.textContent = fmt(S.z);
      zs.textContent = near(S.z, 1) ? '꽉 채움' : (STOPS.length > 1 && near(S.z, ZC)) ? '전체 보임' : (S.z > 1 ? '확대' : '구멍보다 작음 — 빈 곳은 블러');
      btnF.classList.toggle('on', near(S.z, 1)); btnC.classList.toggle('on', STOPS.length > 1 && near(S.z, ZC));
      anc.forEach((e, i) => e.classList.toggle('on', i % 3 - 1 === S.ox && Math.floor(i / 3) - 1 === S.oy)); };
    let stick = 0, ft = 0;
    const flash = () => { zv.classList.add('snap'); clearTimeout(ft); ft = setTimeout(() => zv.classList.remove('snap'), 420); };
    // 앱 setZ 와 같은 자석: wheel = 지나치면 멈춤 + 멈춘 자리에서 한 칸 삼킴 / slider = ±0.045(로그) 안이면 붙음
    const setZ = (z1, mode, an) => { const z0 = S.z; z1 = Math.max(0.1, Math.min(4, z1));
      if (mode === 'slider') { for (const s of STOPS) if (Math.abs(Math.log(z1 / s)) < 0.045) { if (!near(z0, s)) flash(); z1 = s; break; } }
      else { const at = STOPS.find(s => near(z0, s));

        if (cand.length) { z1 = cand[0]; flash(); } }
      if (an) { const V = main, vw0 = V.CW * z0, vh0 = V.CH * z0, l0 = -(vw0 - V.HW) / 2 * (1 + S.ox), t0 = -(vh0 - V.HH) / 2 * (1 + S.oy);
        const u = (an.x - l0) / vw0, w = (an.y - t0) / vh0, vw1 = V.CW * z1, vh1 = V.CH * z1, cl = x => Math.max(-1, Math.min(1, x));

<script>
/* 꽉 채우기 — 크기·배경 변환 창 「맞춤」(여백 두기 / 꽉 채우기) + 「남길 위치」 3×3 점.

SCENES.fill = async (st, R) => {

.s-fill .anc b{width:18px;height:18px;border-radius:5px;border:1px solid transparent;display:grid;place-items:center;transition:background .14s,border-color .14s,transform .12s}
.s-fill .anc b::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.55;transition:all .14s}
.s-fill .anc b.on{background:rgba(var(--accRGB),.16);border-color:rgba(var(--accRGB),.6)}
.s-fill .anc b.on::after{background:var(--acc);opacity:1;width:7px;height:7px}
.s-fill .anc b.press{transform:scale(.88)}
`, st);
  const { $, S } = z;

  const sync = () => {

    $('.fsub').textContent = fill ? '화면을 꽉 채우고 넘치는 쪽을 잘라요' : '원본은 잘리지 않고 여백이 생겨요';
    ao.style.display = fill ? 'flex' : 'none'; $('.bgs').style.display = fill ? 'none' : '';
    dots.forEach(b => b.classList.toggle('on', +b.dataset.ax === S.anc[0] && +b.dataset.ay === S.anc[1]));
    z.lay();
  };
  sync();
  const dot = (ax, ay) => dots.find(b => +b.dataset.ax === ax && +b.dataset.ay === ay);
  R.cursor(170, 330);
  await R.wait(1100);
  // ① 「꽉 채우기」 — 틀을 꽉 채우고 좌우가 잘린다 · 여백 배경 칸 대신 남길 위치
  await R.to(fitB[1], 650);
  await R.click(fitB[1]);
  S.fit = 'fill'; S.anc = [0.5, 0.5]; sync();
  await R.wait(1100);
  // ② 남길 위치 「왼쪽」 → 영상의 왼쪽이 남는다 → 「오른쪽」 → 「가운데」
  for (const [ax, ay, ms] of [[0, 0.5, 1100], [1, 0.5, 1100], [0.5, 0.5, 700]]) {
    const b = dot(ax, ay);
    await R.to(b, 500);
    await R.click(b);
    S.anc = [ax, ay]; sync();
    await R.wait(ms);
  }
  // ③ 「여백 두기」로 돌아가며 처음 화면과 이어진다
  await R.to(fitB[0], 600);
  await R.click(fitB[0]);
  S.fit = 'fit'; sync();
  await R.wait(700);
};

`, st);

  const path = (a, c) => { const dx = Math.max(50, Math.abs(c[0] - a[0]) * .5); return 'M' + a + ' C' + (a[0] + dx) + ',' + a[1] + ' ' + (c[0] - dx) + ',' + c[1] + ' ' + c; };

    '.nmr-note{flex:1;font-size:10px;color:var(--mut)}',
    '.rzb{height:26px;min-width:52px;padding:0 11px;border-radius:7px;border:1px solid var(--stroke);background:var(--field);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:all .2s,transform .12s}',
    '.rzb.ghost{color:var(--mut)} .rzb.pri{background:var(--acc);color:#0a0b0f;border-color:transparent;min-width:64px}',
  ].map(r => r.split(/(?<=\})\s+(?=\.)/).map(x => P + x).join(' ')).join('\n'), st);

  const ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8A2 2 0 0 1 4.8 2.8H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><path d="M7.5 7.5h.01"/></svg>';
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const f = { date: '261124', client: '봄시즌', campaign: '리뷰', page: 2, task: '컷편집', res: '1080x1920', worker: 'KSY', kind: '@SZ', rN: 2, up: false, from: '', to: '' };
  const name = () => { let n = [f.date, f.client, f.campaign, f.page ? f.page + 'p' : '', f.task, f.res, f.worker, f.kind, 'retuch' + (f.rN + (f.up ? 1 : 0))].filter(Boolean).join('_');
    if (f.from) n = n.split(f.from).join(f.to); return n; };
  const from = name();
  // 뒤: 렌더큐 대기 카드(적용하면 이름이 바뀐다)
  const q = h('div', 'k-q nq', '<div class="k-qh"><span>Render Queue</span><span>1</span></div>', st);
  const c1 = h('div', 'k-card sel', '<div class="t"><div class="k-vid"></div></div><div class="x"><div class="nm">' + (from + '.mp4').replace(/_/g, '_<wbr>') + '</div><div class="mt">1080×1920 · 봄시즌.mp4</div><div class="k-prog"><i></i></div></div>', q);
  const dim = h('div', 'k-dim on', '', st);
  const md = h('div', 'k-modal nmr', '<div class="nmr-hd"><span class="hi">' + ICO + '</span><b>파일명 규칙</b><span class="nmr-cnt">카드 1장</span><span class="nmr-x">' + X + '</span></div>'
    + '<div class="nmr-bd"><div class="nmr-grid">'
    + '<label class="nmr-lb">날짜</label><div class="nmr-cell"><span class="nmr-ro">' + f.date + '<i>자동</i></span><span class="mini">오늘로</span></div>'
    + '<label class="nmr-lb">광고주</label><div class="nmr-cell"><div class="k-in nmr-in"><span class="tx">봄시즌</span></div></div>'
    + '<label class="nmr-lb">캠페인</label><div class="nmr-cell"><div class="k-in nmr-in" id="inK"><span class="tx">리뷰</span></div><span class="mini" id="kInc">+1</span></div>'
    + '<label class="nmr-lb">페이지</label><div class="nmr-cell"><div class="k-in nmr-in num" id="inP"><span class="tx">2</span></div><span class="mini">−</span><span class="mini" id="pUp">+</span></div>'
    + '<label class="nmr-lb">작업내용</label><div class="nmr-cell"><div class="k-in nmr-in"><span class="tx">컷편집</span></div><span class="mini">+1</span></div>'
    + '<label class="nmr-lb">작업자</label><div class="nmr-cell"><div class="k-in nmr-in wk"><span class="tx">KSY</span></div><span class="nmr-memo">한 번 넣으면 기억해요</span></div>'
    + '<label class="nmr-lb">작업구분</label><div class="nmr-pills"><span class="nmr-pill">xian</span><span class="nmr-pill">vari</span><span class="nmr-pill">sf</span><span class="nmr-pill" id="rt">retuch<em>2 → 3</em></span></div>'
    + '<label class="nmr-lb">찾아 바꾸기</label><div class="nmr-cell"><div class="k-in nmr-in ph" id="inF"><span class="tx" data-ph="찾을 글자"></span></div><span class="fr-arw">→</span><div class="k-in nmr-in ph" id="inT"><span class="tx" data-ph="바꿀 글자"></span></div></div>'
    + '</div>'
    + '<div><div class="nmr-pvl">미리보기 <span>실제로 만들어질 파일 이름이에요</span></div><div class="nmr-pvbox"><div class="nmr-row"><span class="nmr-from">' + from + '</span><span class="nmr-to"></span></div></div></div>'
    + '</div><div class="nmr-ft"><span class="nmr-note">바뀌는 이름이 없어요</span><span class="rzb ghost">비우기</span><span class="rzb ghost">취소</span><span class="rzb pri" id="ap">적용</span></div>', st);
  md.style.top = Math.max(6, (400 - md.offsetHeight) / 2) + 'px';
  const to = md.querySelector('.nmr-to'), note = md.querySelector('.nmr-note');
  // 바뀐 토큰만 라임으로 — 무엇이 바뀌었는지 한눈에
  const sync = (hot) => { const n = name(); to.innerHTML = n.split('_').map(t => hot && hot.test(t) ? '<b>' + t + '</b>' : t).join('_'); note.textContent = n === from ? '바뀌는 이름이 없어요' : '1장의 이름이 바뀝니다'; };
  sync();
  await R.show(md);
  R.cursor(330, 330);
  await R.wait(500);

  // ① 페이지 + 두 번 — 2p → 3p → 4p
  const pUp = md.querySelector('#pUp'), inP = md.querySelector('#inP .tx');
  await R.to(pUp, 600);
  let off = R.tag('누를 때마다 +1');
  for (let i = 0; i < 2; i++) { await R.click(pUp); f.page++; inP.textContent = f.page; sync(/^\d+p$/); await R.wait(380); }
  off(); await R.wait(250);

  // ② retuch — 수정 차수 2 → 3
  const rt = md.querySelector('#rt');
  await R.to(rt, 550);
  await R.click(rt); rt.classList.add('on'); f.up = true; sync(/^retuch\d+$/);
  off = R.tag('수정 차수 +1');
  await R.wait(900); off();

  // ③ 캠페인 +1 — 리뷰 → 리뷰_1
  const kInc = md.querySelector('#kInc');
  await R.to(kInc, 550);
  await R.click(kInc); f.campaign = '리뷰_1'; md.querySelector('#inK .tx').textContent = f.campaign; sync(/^1$/);
  await R.wait(700);

  // ④ 찾아 바꾸기 — 봄시즌 → 여름
  const inF = md.querySelector('#inF'), inT = md.querySelector('#inT');
  await R.to(inF, 550); await R.click();
  for (const ch of '봄시즌') { await R.type(inF, ch, 110); }
  f.from = '봄시즌';
  await R.to(inT, 450); await R.click(); inF.classList.remove('focus'); inF.querySelector('.caret')?.remove();
  for (const ch of '여름') { await R.type(inT, ch, 140); f.to += ch; sync(/^여름$/); }
  inT.classList.remove('focus'); inT.querySelector('.caret')?.remove();
  await R.wait(700);

  // ⑤ 적용
  const ap = md.querySelector('#ap');
  await R.to(ap, 550); await R.click(ap);
  md.classList.remove('on'); dim.classList.remove('on');
  c1.querySelector('.nm').innerHTML = (name() + '.mp4').replace(/_/g, '_<wbr>');
  R.toast('1장의 이름을 바꿨어요');
  await R.move(330, 330, 700);
  await R.wait(1300);
};

<script>
/* 여러 카드 이름 한 번에 — 렌더큐 드래그 선택(#marquee) → F2 → 「파일명 규칙」 모달 N장 모드(고른 항목만 기존 이름 뒤에 얹기).
   앱 근거: index.html openNameRule(N장: 페이지·작업자·작업종류·작업구분만) · brcApplyTail · nmrSync(「N장에 적용」) · nmrApply 토스트.
   단순화: 카드 5장(앱 예시는 18장), 합성·완료 기록 제외 상황 생략, 작업자 이니셜은 가상 값. */
SCENES.namemulti = async (st, R) => {
  st.classList.add('s-namemulti');
  const P = '.s-namemulti ';
  h('style', '', [
    '.nq{width:272px}',
    '.k-card .nm{white-space:normal;word-break:normal;overflow-wrap:anywhere;font-size:9.5px;line-height:1.3}',
    '.jst{flex:none;align-self:flex-start;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--dim)}',
    '.mq{position:absolute;z-index:30;border:1.5px solid var(--acc);background:rgba(var(--accRGB),.12);border-radius:4px;width:0;height:0;transition:width 1.1s linear,height 1.1s linear,opacity .2s}',
    '.nmr{width:540px;left:50px}',
    '.nmr-hd{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--stroke)}',
    '.nmr-hd .hi svg{width:14px;height:14px;color:var(--acc);display:block} .nmr-hd b{font-size:12px;font-weight:600}',
    '.nmr-cnt{flex:1;font-size:10px;color:var(--mut)}',
    '.nmr-x svg{width:12px;height:12px;color:var(--mut);display:block}',
    '.nmr-bd{padding:8px 11px;display:flex;flex-direction:column;gap:6px}',
    '.nmr-grid{display:grid;grid-template-columns:50px minmax(0,1fr);gap:5px 9px;align-items:center}',
    '.nmr-lb{font-size:9.5px;color:var(--mut);font-weight:600;text-align:right}',
    '.nmr-lb.tp{align-self:start;padding-top:5px}',
    '.nmr-memo{flex:none;font-size:9.5px;color:var(--dim)}',
    '.nmr-in{width:62px;height:21px;border-radius:7px;border:1px solid var(--stroke);background:var(--field);font-size:10px;padding:0 8px;display:flex;align-items:center;color:var(--dim)}',
    '.nmr-pills{display:flex;flex-wrap:wrap;gap:4px}',
    '.nmr-pill{height:20px;padding:0 6px;border-radius:7px;border:1px solid var(--stroke);background:var(--field);color:var(--mut);font-size:10px;display:inline-flex;align-items:center;white-space:nowrap;transition:all .2s,transform .12s}',
    '.nmr-pill.on{background:rgba(var(--accRGB),.16);border-color:rgba(var(--accRGB),.6);color:var(--acc)}',
    '.nmr-pill em{font-style:normal;opacity:.62;margin-left:3px;font-size:9px}',
    '.nmr-hint{font-size:9.5px;color:var(--dim);line-height:1.45}',
    '.nmr-pvl{font-size:10px;color:var(--mut);font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}',
    '.nmr-pvl span{color:var(--dim);font-weight:400;font-size:9px}',
    '.nmr-pvbox{height:112px;overflow:hidden;border:1px solid var(--stroke);border-radius:8px;background:var(--field);padding:3px}',
    '.nmr-row{padding:3px 7px;font-size:10px;line-height:1.4;word-break:break-all}',
    '.nmr-row+.nmr-row{border-top:1px solid var(--stroke)}',
    '.nmr-from{display:block;color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.22)}',
    '.nmr-to{display:block;color:var(--txt);font-weight:600}',
    '.nmr-row.same .nmr-from{display:none} .nmr-row.same .nmr-to{color:var(--mut);font-weight:400}',
    '.nmr-ft{display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--stroke)}',
    '.nmr-note{flex:1;font-size:10px;color:var(--mut)}',
    '.rzb{height:26px;min-width:60px;padding:0 12px;border-radius:7px;border:1px solid var(--stroke);background:var(--field);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:all .25s var(--ease),transform .3s var(--ease)}',
    '.rzb.ghost{color:var(--mut)} .rzb.pri{background:var(--acc);color:#0a0b0f;border-color:transparent;min-width:72px} .rzb.off{opacity:.5}',
    '.rzb.big{transform:scale(1.14);box-shadow:0 0 22px -4px rgba(var(--accRGB),.7)}',
    '.press{transform:scale(.94)}',
  ].map(r => r.split(/(?<=\})\s+(?=\.)/).map(x => P + x).join(' ')).join('\n'), st);

  const D = '261124', ext = '.mp4';
  const ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8A2 2 0 0 1 4.8 2.8H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><path d="M7.5 7.5h.01"/></svg>';
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const wb = s => s.replace(/_/g, '_<wbr>');

  // 왼쪽: 소재 노드 둘(맥락) · 오른쪽: 리사이즈 대기 카드 5장
  [['', '봄시즌.mp4', 64], ['b2', '여름_리뷰.mp4', 214]].forEach(([c, n, y]) => { const e = h('div', 'k-node v', '<div class="th"><div class="k-vid ' + c + '"></div></div><div class="nm">' + n + '</div><div class="mt">1080×1920 · 15.0s</div>', st); e.style.cssText = 'left:80px;top:' + y + 'px'; });
  const JOBS = [['', '봄시즌', '1080x1920'], ['', '봄시즌', '1080x1350'], ['', '봄시즌', '1080x1080'], ['b2', '여름_리뷰', '1080x1920'], ['b2', '여름_리뷰', '1080x1080']];
  const q = h('div', 'k-q nq', '<div class="k-qh"><span>Render Queue</span><span>' + JOBS.length + '</span></div>', st);
  const cards = JOBS.map(([c, v, s]) => { const stem = D + '_' + v + '_' + s;
    const el = h('div', 'k-card', '<div class="t"><div class="k-vid ' + c + '"></div></div><div class="x"><div class="nm">' + wb(stem + ext) + '</div><div class="mt">' + s.replace('x', '×') + ' · ' + v + '.mp4</div><div class="k-prog"><i></i></div></div><span class="jst">대기</span>', q);
    el._stem = stem; return el; });

  // 파일명 규칙 모달(N장) — 기억한 작업자 이니셜이 미리 채워져 있어 열자마자 그 값이 얹힌다
  const n = JOBS.length, f = { worker: 'KSY', kind: '', type: '' };
  const tail = s => [s, f.worker, f.kind, f.type].filter(Boolean).join('_');
  const pills = (k, lb, opts) => '<label class="nmr-lb tp">' + lb + '</label><div class="nmr-pills">' + opts.map(o => '<span class="nmr-pill" data-k="' + k + '" data-v="' + o[0] + '">' + o[0] + (o[1] ? '<em>' + o[1] + '</em>' : '') + '</span>').join('') + '</div>';
  const KIND = [['@MB', '모션배너'], ['@BC', '배너결합'], ['@SZ', '사이즈배리'], ['@ED', '편집'], ['@AV', 'AI활용영상'], ['@AB', 'AI활용배너'], ['@MV', '모션영상'], ['@SH', '촬영'], ['@CP', '용량배리']];
  const dim = h('div', 'k-dim', '', st);
  const md = h('div', 'k-modal nmr', '<div class="nmr-hd"><span class="hi">' + ICO + '</span><b>파일명 규칙</b><span class="nmr-cnt">카드 ' + n + '장</span><span class="nmr-x">' + X + '</span></div>'
    + '<div class="nmr-bd"><div class="nmr-grid">'
    + '<label class="nmr-lb">페이지</label><div><span class="nmr-in">그대로</span></div>'
    + '<label class="nmr-lb">작업자</label><div style="display:flex;align-items:center;gap:6px"><span class="nmr-in" style="color:var(--txt)">KSY</span><span class="nmr-memo">한 번 넣으면 기억해요</span></div>'
    + pills('kind', '작업종류', KIND)
    + pills('type', '작업구분', [['xian'], ['vari'], ['sf']])
    + '</div><div class="nmr-hint">고른 항목만 기존 이름 뒤에 얹어요 — 여기서는 지울 수 없습니다(지우려면 카드를 한 장씩 열어 [편집]).</div>'
    + '<div><div class="nmr-pvl">미리보기 <span>실제로 만들어질 파일 이름이에요</span></div><div class="nmr-pvbox">'
    + cards.map(c => '<div class="nmr-row same"><span class="nmr-from">' + c._stem + '</span><span class="nmr-to">' + c._stem + '</span></div>').join('') + '</div></div>'
    + '</div><div class="nmr-ft"><span class="nmr-note">바뀌는 이름이 없어요</span><span class="rzb ghost">취소</span><span class="rzb pri off" id="ap">적용</span></div>', st);
  md.style.top = Math.max(6, (400 - md.offsetHeight) / 2) + 'px';
  const rows = [...md.querySelectorAll('.nmr-row')], note = md.querySelector('.nmr-note'), ap = md.querySelector('#ap');
  // 미리보기 줄이 위에서 아래로 차례로 길어진다
  const sync = async () => {
    note.textContent = n + '장의 이름이 바뀝니다'; ap.classList.remove('off'); ap.textContent = n + '장에 적용';
    for (let i = 0; i < n; i++) { rows[i].classList.remove('same'); rows[i].querySelector('.nmr-to').textContent = tail(cards[i]._stem); await R.wait(70); }
  };
  const press = async (k, v, ms) => { const b = md.querySelector('.nmr-pill[data-k="' + k + '"][data-v="' + v + '"]'); await R.to(b, ms); await R.click(b); b.classList.add('on'); f[k] = v; await sync(); };

  // ── 박자 ──
  R.cursor(300, 360);
  await R.wait(400);
  // 드래그 선택: 카드 위 빈자리 → 마지막 카드 아래까지
  const a = R.pos(cards[0]), z = R.pos(cards[n - 1]);
  const x0 = a.l - 4, y0 = a.t - 5, x1 = a.l + a.w - 22, y1 = z.t + z.h + 5;
  await R.move(x0, y0, 600);
  const mq = h('div', 'mq', '', st); mq.style.left = x0 + 'px'; mq.style.top = y0 + 'px';
  R.cur.style.transitionTimingFunction = 'linear';
  await R.wait(20);
  mq.style.width = (x1 - x0) + 'px'; mq.style.height = (y1 - y0) + 'px';
  cards.forEach(c => { const p = R.pos(c); setTimeout(() => c.classList.add('sel'), 1100 * (p.t + 8 - y0) / (y1 - y0)); });
  await R.move(x1, y1, 1100);
  R.cur.style.transitionTimingFunction = '';

SCENES.pick = async (st, R) => {
  const z = rzBuild(st, 'pick', {});
  const { $, chips, sel } = z;
  // ① 기본 8종 칩이 위에서부터 차례로
  const order = Object.values(chips).slice(0, 8);
  order.forEach(b => b.style.opacity = 0);
  R.cursor(170, 300);
  await R.wait(250);
  for (const b of order) { b.style.opacity = ''; b.classList.add('pop'); await R.wait(55); }
  await R.wait(200);
  // ② 칩 두 개 체크 → 미리보기 틀 비율이 바뀐다
  const pickChip = async k => { await R.to(chips[k], 550, -40); await R.click(chips[k]); sel.add(k); z.setAct(k); await R.wait(350); };
  await pickChip('1080x1920');
  await pickChip('1080x1350');
  // ③ 「/」 → 입력칸에 1600x2000 → 해석 목록 → Enter → 「내 크기」에 체크된 새 칩
  await R.move(170, 300, 500);   // 손은 키보드로
  await R.keys('/');
  z.inp.innerHTML = '<span class="tx"></span><i class="caret"></i>';
  await R.type(z.inp, '1600x2000', 65);
  const p = R.pos(z.inp), sug = h('div', 'sug', '<div class="r"><b>1600×2000 · 4:5</b> 추가<span class="pk">Enter</span></div><div class="f">↑↓ 고르기 · Enter 추가 · Esc 닫기</div>', st);
  sug.style.cssText = 'left:' + p.l + 'px;top:' + (p.t + p.h + 5) + 'px;width:' + p.w + 'px';
  await R.show(sug); await R.wait(550);
  await R.keys('Enter');
  sug.remove();
  z.inp.classList.remove('focus'); z.inp.innerHTML = '<span class="ph">직접 입력 — 1440x1800 · 4:5 1440</span>';
  z.mine.style.display = '';
  const nc = z.mk('1600x2000', z.gr); nc.classList.add('pop');
  sel.add('1600x2000'); z.setAct('1600x2000');
  await R.wait(700);
  // ④ 「더 보기」 → 꺾쇠가 돌며 「그 밖의 크기」 6종 → 「접기」
  const more = $('.more');
  await R.to(more, 600, 6);
  await R.click(more);
  more.classList.add('open'); more.firstChild.textContent = '접기';
  z.oth.style.display = ''; z.oth.querySelectorAll('.pl').forEach((b, i) => { b.style.animationDelay = (i * 40) + 'ms'; b.classList.add('pop'); });
  // 앱 패널(.rz-side)은 넘치면 스크롤된다 — 펼친 동안 「맞춤」 칸이 보이게 아래로 굴렸다가 「접기」 전에 되돌린다
  const pn = $('.pn');
  await R.wait(300);
  pn.scrollTo({ top: pn.scrollHeight - pn.clientHeight, behavior: 'smooth' });
  await R.wait(1000);
  pn.scrollTo({ top: 0, behavior: 'smooth' });
  await R.wait(350);
  await R.to(more, 300, 6);
  await R.click(more);
  more.classList.remove('open'); more.firstChild.textContent = '더 보기';
  z.oth.style.display = 'none';
  await R.wait(400);
};

   실제 앱: 선 위에 올리면 선 가운데에 X 칩이 뜨고(호버), 누르면 그 연결만 끊긴다. 칩 호버는 앱의 위험 버튼 언어(빨강). */
SCENES.wirecut = async (st, R) => {
  // 노드 셋: 영상 2 → 배너 1 (연결 2개)
  const mk = (cls, x, y, thumb, nm, mt) => { const n = h('div', 'k-node ' + cls, '<div class="th">' + thumb + '</div><div class="nm">' + nm + '</div><div class="mt">' + mt + '</div><span class="k-port"></span>', st); n.style.left = x + 'px'; n.style.top = y + 'px'; return n; };
  const v1 = mk('v', 60, 52, '<div class="k-vid"></div>', '봄시즌_15s.mp4', '1080×1920 · 15.0s');
  const v2 = mk('v', 60, 232, '<div class="k-vid b2"></div>', '여름_리뷰_10s.mp4', '1080×1920 · 10.0s');
  const b = mk('b', 420, 140, '<div class="k-ban"></div><div class="k-hole" style="left:18%;top:16%;width:64%;height:62%"></div>', '메인배너_1080.png', '1080×1080');
  const svg = h('div', '', '<svg class="k-svg" viewBox="0 0 640 400"><path class="k-wire" id="w1"/><path class="k-wire" id="w2"/></svg>', st).firstChild;
  st.insertBefore(svg, st.firstChild);
  const P = (n) => { const p = R.pos(n.querySelector('.k-port')); return [p.x, p.y]; };
  const path = (a, c) => { const dx = Math.max(60, (c[0] - a[0]) * .5); return 'M' + a + ' C' + (a[0] + dx) + ',' + a[1] + ' ' + (c[0] - dx) + ',' + c[1] + ' ' + c; };

  w1.setAttribute('d', path(P(v1), P(b))); w2.setAttribute('d', path(P(v2), P(b)));
  // Render Queue 헤더 배지 흉내 — 연결 2개 = 잡 2개
  const cnt = h('div', '', '', st); cnt.style.cssText = 'position:absolute;right:14px;top:12px;font-size:11px;color:var(--mut);font-weight:500;display:flex;align-items:center;text-transform:uppercase;letter-spacing:.04em';
  const setCnt = n => cnt.innerHTML = 'Render Queue <span style="margin-left:6px;font-size:10px;color:var(--mut);background:rgba(255,255,255,.06);padding:2px 9px;border-radius:20px">' + n + '</span>';
  setCnt(2);
  R.cursor(560, 360);
  await R.wait(600);
  // 아래 선 가운데로 — 선이 굵어지고 X 칩이 뜬다
  const len = w2.getTotalLength(), mid = w2.getPointAtLength(len / 2);
  await R.move(mid.x + 40, mid.y + 30, 700);
  await R.move(mid.x + 2, mid.y + 2, 500);
  w2.style.strokeWidth = 3.6;
  const x = h('div', 'k-x', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>', st);
  x.style.cssText = 'position:absolute;left:' + (mid.x - 11) + 'px;top:' + (mid.y - 11) + 'px;transform:scale(.6);opacity:0;transition:all .2s var(--ease);z-index:20';
  await R.wait(30); x.style.transform = 'none'; x.style.opacity = 1;
  await R.wait(500);
  // 앱 .ecut.on:hover(위험 버튼 언어) + 끊길 선 .cutarm(빨강)
  x.style.transform = 'scale(1.18)'; x.style.background = 'rgba(42,18,24,.95)'; x.style.color = '#e8576c'; x.style.borderColor = 'rgba(232,87,108,.5)'; x.style.boxShadow = '0 0 0 3px rgba(232,87,108,.14),0 4px 14px rgba(0,0,0,.5)';
  w2.style.stroke = '#e8576c'; w2.style.opacity = .95;
  await R.wait(300);
  await R.click(x);
  // 끊김 — 선이 사라지고 카운터 1
  x.style.opacity = 0; w2.style.transition = 'opacity .24s'; w2.style.opacity = 0;
  setCnt(1);
  await R.toast('연결을 끊었어요 · Ctrl+Z 로 되돌릴 수 있어요');
  await R.move(560, 360, 700);
  await R.wait(500);
};

</script>
<script>
/* 함께 맞추기 — 합성 미리보기 오른쪽 패널 맨 아래 「같은 배치 함께 맞추기」(처음부터 켬).
   실제 앱 글자: xsRender(index.html) · 렌더큐 카드 알약 xsPillHTML(「함께」/「빠짐」).
   순서: 한 장 빼기 → 영상 옮기고 키우기 → 닫으면 같은 배치 카드 썸네일이 같이 바뀌고, 뺀 카드는 그대로. */
SCENES.xfsync = async (st, R) => {
  st.classList.add('s-xfsync');
  h('style', '', `
.s-xfsync .q{left:150px;top:14px;width:340px;height:372px;overflow:hidden}
.s-xfsync .q .k-hd{text-transform:uppercase;letter-spacing:.04em;font-weight:500;font-size:11.5px;margin-bottom:8px}

.s-xfsync .jfn{flex:1;min-width:0;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden}

.s-xfsync .pl.w{background:rgba(255,255,255,.06);color:var(--mut)}
.s-xfsync .js{flex:none;font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:20px;line-height:1.5;background:rgba(255,255,255,.06);color:var(--dim)}
.s-xfsync .jbar{height:4px;border-radius:3px;background:rgba(140,140,150,.22);margin:6px 0 5px}
.s-xfsync .jsrc{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-xfsync .bn .hl{position:absolute;overflow:hidden}

.s-xfsync .md{left:14px;top:10px;width:612px;height:380px}
.s-xfsync .md .k-hd{font-weight:600}
.s-xfsync .md .k-x{margin-left:auto}
.s-xfsync .stg{position:absolute;left:16px;top:48px;width:300px;height:300px;border-radius:4px;overflow:hidden}
.s-xfsync .sd{position:absolute;left:334px;top:46px;width:262px}
.s-xfsync .lb{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:7px}
.s-xfsync .sl{display:flex;align-items:center;gap:10px}
.s-xfsync .tr{flex:1;height:4px;border-radius:3px;position:relative;background:linear-gradient(to right,var(--acc) 0 var(--p),rgba(140,140,150,.28) var(--p) 100%);}
.s-xfsync .tr .tk{position:absolute;top:-8px;left:calc(6.5px + (100% - 13px) * .624);width:2px;height:5px;margin-left:-1px;border-radius:1px;background:var(--mut);opacity:.55}
.s-xfsync .tr>i:not(.tk){position:absolute;top:-4.5px;left:calc(6.5px + (100% - 13px) * var(--t));width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--acc)}
.s-xfsync .sl b{width:44px;text-align:right;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.s-xfsync .sw{display:flex;align-items:center;gap:10px;margin-top:16px}
.s-xfsync .tg{width:38px;height:22px;border-radius:99px;background:var(--acc);position:relative;flex:none}
.s-xfsync .tg::after{content:'';position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#0a0b0f}
.s-xfsync .sw b{display:block;font-size:12px;font-weight:600}
.s-xfsync .sw span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.s-xfsync .rw{display:flex;align-items:center;gap:9px;min-height:31px;padding:4px 10px 4px 9px;margin-top:5px;border-radius:9px;border:1px solid var(--stroke);background:var(--field);transition:all .2s}
.s-xfsync .rows{margin-top:6px}
.s-xfsync .rw::before{content:'✓';flex:none;width:15px;height:15px;border-radius:5px;border:1.5px solid var(--stroke2);font-size:10px;font-weight:800;line-height:13px;text-align:center;color:transparent}
.s-xfsync .rw.on{background:rgba(var(--accRGB),.16);border-color:rgba(var(--accRGB),.6);color:var(--acc)}
.s-xfsync .rw.on::before{background:var(--acc);border-color:var(--acc);color:#0a0b0f}
.s-xfsync .rw.na{opacity:.5}
.s-xfsync .rw p{margin:0;line-height:1.3;min-width:0}
.s-xfsync .rw p b{display:block;font-size:11.5px;font-weight:600}
.s-xfsync .rw p small{display:block;font-size:10px;color:var(--dim);white-space:nowrap}
.s-xfsync .rw.on p small{color:rgba(var(--accRGB),.75)}
.s-xfsync .inf{margin-top:9px;font-size:11px;color:var(--acc)}
`, st);
  // 배너(파란 판) + 영상 자리 + 영상 — hole = [left,top,w,h] %
  const SAME = [12, 22, 76, 56], LOW = [12, 50, 76, 40];
  const ban = (hole) => '<div class="k-ban"></div><div class="hl" style="left:' + hole[0] + '%;top:' + hole[1] + '%;width:' + hole[2] + '%;height:' + hole[3] + '%"><div class="vw"><div class="k-vid"></div></div></div>';
  const XF = 'translate(14%,-10%) scale(1.4)';

  // ── 뒤: 렌더큐 ──
  const q = h('div', 'k-win q', '<div class="k-hd">Render Queue<span class="cnt">5</span></div>', st);
  const CARDS = [['봄시즌_메인', SAME, '함께'], ['봄시즌_피드A', SAME, '함께'], ['봄시즌_피드B', SAME, '함께'], ['봄시즌_피드C', SAME, '함께'], ['봄시즌_하단', LOW, '']];
  const cards = CARDS.map(([nm, hole, pill]) => h('div', 'jb',
    '<div class="jt"><div class="bn">' + ban(hole) + '</div></div><div class="jbody"><div class="jtop"><span class="jfn">' + nm + '_15s.mp4</span>' + (pill ? '<span class="pl">' + pill + '</span>' : '') + '<span class="js">대기</span></div><div class="jbar"></div><div class="jsrc">' + nm + '.png ← 봄시즌_15s.mp4</div></div>', q));

  // ── 앞: 합성 미리보기 ──
  const dim = h('div', 'k-dim on', null, st);
  const md = h('div', 'k-modal md on', '', st);
  md.innerHTML = '<div class="k-hd">봄시즌_메인.png&nbsp;&nbsp;←&nbsp;&nbsp;봄시즌_15s.mp4<span class="k-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>'
    + '<div class="stg bn">' + ban(SAME) + '</div>'
    + '<div class="sd"><div class="lb">크기</div><div class="sl"><div class="tr" style="--p:62.4%;--t:.624"><i></i><i class="tk"></i></div><b>100%</b></div>'
    + '<div class="sw"><div class="tg"></div><div><b>같은 배치 함께 맞추기</b><span>같은 영상 · 다른 배너 중 같은 배치 3장</span></div></div>'
    + '<div class="rows">'
    + ['봄시즌_피드A', '봄시즌_피드B', '봄시즌_피드C'].map(n => '<div class="rw on"><p><b>' + n + '</b><small>같은 배치 · 함께 움직임</small></p></div>').join('')
    + '<div class="rw na"><p><b>봄시즌_하단</b><small>영상 자리 다름 — 자동 제외</small></p></div></div>'
    + '<div class="inf">같은 배치 <b>3장</b>이 함께 움직여요</div></div>';
  const rows = md.querySelectorAll('.rw'), inf = md.querySelector('.inf'), tr = md.querySelector('.tr'), zv = md.querySelector('.sl b');
  const vw = md.querySelector('.stg .vw'), stg = md.querySelector('.stg');

  R.cursor(560, 370);
  await R.wait(500);
  // 1) 한 장 빼기 — 체크 끔
  await R.to(rows[2], 650, 40, 2);
  await R.click(rows[2]);
  rows[2].classList.remove('on'); rows[2].querySelector('small').textContent = '같은 배치 · 빠짐';
  inf.innerHTML = '같은 배치 <b>2장</b>이 함께 움직여요';
  R.toast('「봄시즌_피드C」를 뺐어요 — 이제 따로 움직여요').catch(() => {});
  // 2) 자동 제외 줄은 눌러도 그대로
  await R.to(rows[3], 450, 40, 2);
  await R.click(null);
  await R.wait(350);
  // 3) 영상 옮기고 휠로 키우기
  const c = R.pos(stg.querySelector('.hl'));
  await R.move(c.x, c.y, 650);
  vw.style.transform = 'translate(14%,-10%)';
  await R.move(c.x + 32, c.y - 17, 700);
  R.keys('휠').catch(() => {});
  vw.style.transform = XF;
  // 앱 z2t: 로그 눈금 10%~400% — 손잡이·채움·숫자를 같은 값으로 함께 갱신
  for (let z = 102; z <= 140; z += 2) {
    const t = Math.log(z / 10) / Math.log(40);
    zv.textContent = z + '%'; tr.style.setProperty('--t', t.toFixed(4)); tr.style.setProperty('--p', (t * 100).toFixed(2) + '%');
    await R.wait(34);
  }
  await R.wait(400);
  // 4) 닫기 → 렌더큐 썸네일이 같이 바뀜, 뺀 카드는 그대로 + 「빠짐」
  await R.to(md.querySelector('.k-x'), 600);
  await R.click(md.querySelector('.k-x'));
  md.classList.remove('on'); dim.classList.remove('on');
  await R.wait(250);
  [0, 1, 2].forEach(i => { cards[i].querySelector('.vw').style.transform = XF; cards[i].classList.add('hi'); });
  const p3 = cards[3].querySelector('.pl'); p3.textContent = '빠짐'; p3.classList.add('w');
  await R.move(520, 300, 700);
  await R.wait(1900);
};

<script>

/* ═══ 발표 틀 ═══ */
const deck = document.getElementById('deck');
const TAGS = { new:['new','신규 기능'], imp:['imp','개선'], fix:['fix','수리'] };
const ARW = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d<0?'M15 6l-6 6 6 6':'M9 6l6 6-6 6')+'"/></svg>';
const CK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const N = SLIDES.length;
function topBar(i){ return '<div class="top"><span class="lg">'+LOGO+'</span>BannerNode v1.0.204 · 신규 기능<span class="sp"></span><span class="n"><b>'+String(i+1).padStart(2,'0')+'</b> / '+String(N).padStart(2,'0')+'</span></div>'; }
SLIDES.forEach((s,i)=>{
  const el=h('section','slide',null,deck); el.id='s'+(i+1); el.setAttribute('aria-label',(s.title||s.kind));
  if(s.kind==='cover'){
    el.innerHTML='<div class="cover"><div class="big">'+LOGO+'</div><h1>BannerNode<br><em>신규 기능</em></h1><div class="sub">'+s.sub+'</div><div class="ver"><b>v1.0.204</b></div></div>';
  } else if(s.kind==='toc'){
    el.innerHTML=topBar(i)+'<div class="toc">'+s.groups.map(g=>'<div><h3>'+g.name+'</h3><ol>'+g.items.map(it=>{ const j=SLIDES.findIndex(x=>x.id===it); return '<li><button type="button" data-go="'+j+'"><i>'+String(j+1).padStart(2,'0')+'</i>'+SLIDES[j].title+'<em>'+TAGS[SLIDES[j].tag][1]+'</em></button></li>'; }).join('')+'</ol></div>').join('')+'</div>';
  } else if(s.kind==='fixes'){
    el.innerHTML=topBar(i)+'<div class="fixhd"><span class="tag fix">수리 · 개선</span><h2>'+s.title+'</h2><p>'+s.line+'</p></div><div class="fixes">'+s.items.map((f,k)=>'<div class="fx" style="transition-delay:'+(k*70)+'ms"><span class="ck">'+CK+'</span><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('')+'</div>';
  } else {
    const t=TAGS[s.tag];
    el.innerHTML=topBar(i)+'<div class="side"><span class="tag '+t[0]+'">'+t[1]+'</span><h2>'+s.title+'</h2><p>'+s.line+'</p>'+(s.keys?'<div class="keys">'+s.keys.map(k=>'<span class="kc">'+k+'</span>').join('')+'</div>':'')+'<span class="where">'+s.where+'</span></div>'
      +'<div class="frame"><div class="bar"><i></i><i></i><i></i><span>'+s.where+'</span></div><div class="stwrap"><div class="st"></div></div></div>';
  }
  const nav=h('div','nav',null,el);
  nav.innerHTML=SLIDES.map((x,k)=>'<button type="button" class="dot'+(k===i?' on':'')+'" data-go="'+k+'" aria-label="'+(k+1)+'번째 장"></button>').join('')+'<span class="sp"></span><span class="hint">← → 넘기기</span><button type="button" class="arw" data-d="-1" aria-label="이전 장">'+ARW(-1)+'</button><button type="button" class="arw" data-d="1" aria-label="다음 장">'+ARW(1)+'</button>';
});
let cur=-1, runner=null;
function go(i){
  i=Math.max(0,Math.min(N-1,i)); if(i===cur) return;
  if(runner){ runner.dead=true; clearTimeout(runner._t); runner=null; }
  deck.querySelectorAll('.slide').forEach((e,k)=>e.classList.toggle('on',k===i)); cur=i;
  const s=SLIDES[i], st=deck.querySelectorAll('.slide')[i].querySelector('.st');
  if(st&&s.scene) runScene(s.scene, st).then(r=>{ runner=r; });
  if(location.hash!=='#s'+(i+1)) history.replaceState(null,'','#s'+(i+1));
}
deck.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) return go(+g.dataset.go); const a=e.target.closest('[data-d]'); if(a) go(cur+ +a.dataset.d); });
addEventListener('keydown',e=>{ if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); } else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); } else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1); });
function fit(){ const s=Math.min((innerWidth-0)/1280,(innerHeight-0)/720); deck.style.transform='scale('+s+')'; }
addEventListener('resize',fit); fit();
function fromHash(){ const m=/^#s(\d+)$/.exec(location.hash); go(m?(+m[1]-1):0); }
addEventListener('hashchange',fromHash); fromHash();
</script>
